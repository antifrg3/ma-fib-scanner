name: dashboard   # 매일 장 마감 후 스캔 → 웹 대시보드 자동 배포 (GitHub Pages)

on:
  push:
    branches: [main]          # 파일을 고쳐 올리면 자동 재배포
  schedule:
    # ── 종가 확정 시각 — 셋업 스크리너(일봉 기준)는 이 두 번만 갱신 ──
    - cron: "30 7 * * 1-5"   # 16:30 KST · 한국장 마감 후(당일 종가 확정)
    - cron: "0 22 * * 1-5"   # 07:00 KST(다음날) · 미국장 마감 후
    # ── 4시간봉 스캐너(MTF·SS밴드 등) ──
    - cron: "0 0,4,8,12,16,20 * * *"  # 4시간마다 · KST 09/13/17/21/01/05 (바이낸스 4h봉 경계)
  workflow_dispatch:          # 수동 실행 버튼

# GitHub Pages 배포 권한
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40        # 전체 40분 제한 (초과 시 실패시키고 다음 사이클로)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt pykrx

      - name: Refresh universe (나스닥100 · 코스피200 · 크립토 거래대금 상위)
        run: python build_universe.py
        timeout-minutes: 5
        env:
          CRYPTO_TOP_N: "50"        # 크립토 스캔 개수 (바꾸려면 이 숫자만 수정)
        continue-on-error: true   # 실패해도 기존 종목 파일로 진행

      - name: Build dashboard
        run: python build_site.py
        timeout-minutes: 8
        continue-on-error: true

      - name: Build breakout page
        run: python build_breakout.py
        timeout-minutes: 8
        continue-on-error: true

      - name: Build squeeze page
        run: python build_squeeze.py
        timeout-minutes: 6
        continue-on-error: true

      - name: Build alignment page
        run: python build_alignment.py
        timeout-minutes: 6
        continue-on-error: true

      - name: Build outperform page
        run: python build_outperform.py
        timeout-minutes: 8
        continue-on-error: true

      - name: Build ssband page
        run: python build_ssband.py
        timeout-minutes: 8
        continue-on-error: true

      - name: Build mtfband page
        run: python build_mtfband.py
        timeout-minutes: 8
        continue-on-error: true

      - name: Build flows page
        run: python build_flows.py
        timeout-minutes: 6
        continue-on-error: true

      # 셋업은 일봉 기준이라 종가 확정 시각(하루 2회)과 수동/푸시에서만 갱신한다.
      # 장중 미확정 일봉으로 판정하면 신호가 흔들리고 알림도 중복된다.
      - name: Build setup page
        if: >-
          github.event.schedule == '30 7 * * 1-5' ||
          github.event.schedule == '0 22 * * 1-5' ||
          github.event_name == 'workflow_dispatch' ||
          github.event_name == 'push'
        run: python build_setup.py
        timeout-minutes: 10
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      # Pages는 site/ 폴더를 통째로 교체한다. 셋업을 스킵한 실행에서는
      # setup.html이 없어 기존 페이지가 사라지므로, 배포된 사본을 복원한다.
      - name: Restore skipped pages
        run: |
          set +e
          BASE="https://antifrg3.github.io/ma-fib-scanner"
          mkdir -p site/charts
          # 1) 페이지·상태 파일 복원
          for f in setup.html setup_state.json; do
            if [ ! -f "site/$f" ]; then
              curl -fsSL "$BASE/$f" -o "site/$f" \
                && echo "복원: $f" || echo "복원 실패(최초 실행 가능): $f"
            fi
          done
          # 2) 복원된 setup.html이 참조하는 차트(su_*.png)도 함께 가져온다.
          #    이미지가 없으면 페이지는 열려도 차트가 깨진다.
          if [ -f "site/setup.html" ]; then
            grep -o 'charts/su_[A-Za-z0-9_]*\.png' site/setup.html | sort -u | while read -r rel; do
              if [ ! -f "site/$rel" ]; then
                curl -fsSL "$BASE/$rel" -o "site/$rel" 2>/dev/null \
                  && echo "차트 복원: $rel" || true
              fi
            done
          fi
          exit 0

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "site"
      - id: deployment
        uses: actions/deploy-pages@v4
